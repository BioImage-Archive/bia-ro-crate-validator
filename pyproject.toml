[project]
name = "bia-ro-crate-validator"
version = "0.3.0"
description = "Data models for describing, parsing, and validating the RO-Crate profile for BIA submissions, with supporting structures such as file lists."
license = "Apache 2.0"
readme = "README.md"
authors = [
    {name = "Francois Sherwood", email = "fsherwood@ebi.ac.uk"},
    {name = "Cesare", email = "cesare@ebi.ac.uk"},
]
requires-python = ">=3.13"
keywords = ["bia", "bioimage archive", "json-ld", "ro-crate", "validator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas (>=3.0.2,<4.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pyld (>=2.0.4,<3.0.0)",
    "rdflib (>=7.6.0,<8.0.0)",
    "rich (>=13.9,<14.0)",
    "roc-validator (>=0.8.1,<0.9.0)",
    "typer (>=0.24.1,<0.25.0)",
]

[project.scripts]
bia-ro-crate = "bia_ro_crate.cli:bia_ro_crate"

[project.urls]
Homepage = "https://github.com/BioImage-Archive/bia-ro-crate-validator"
Issues = "https://github.com/BioImage-Archive/bia-ro-crate-validator/issues"
Repository = "https://github.com/BioImage-Archive/bia-ro-crate-validator"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "commitizen (>=4.13.9,<5.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-check (>=2.8.0,<3.0.0)",
    "ruff (>=0.15.8,<0.16.0)",
]

[tool.poetry]
packages = [
    {include = "bia_ro_crate", from = "src"},
]
include = [
    {path = "src/bia_ro_crate/validator/profiles/*.json", format = ["sdist", "wheel"]},
]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"

[tool.black]
target-version = ["py313"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
version_files = [
    "pyproject.toml:version"
]
update_changelog_on_bump = true
major_version_zero = true

[tool.isort]
profile = "black"
py_version = 313
src_paths = ["src", "test"]
known_first_party = ["bia_ro_crate"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:rdflib",
]

[tool.ruff]
line-length = 88
target-version = "py313"
