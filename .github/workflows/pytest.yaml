name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
            - ubuntu-22.04
            - macos-latest
            - windows-latest
        python-version:
            - "3.13"
            - "3.14"

    runs-on: ${{ matrix.os }}

    steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: ${{ matrix.python-version }}
      
        - uses: abatilo/actions-poetry@v2

        - name: Install Poetry
          run: pip install poetry==2.4.1

        - name: Install dependencies
          run: poetry install

        - uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: "17"

        - uses: actions/cache@v4
          with:
            path: artifacts/ontology-consistency/tools/robot.jar
            key: robot-${{ hashFiles('scripts/ontology/check_ontology.py', 'scripts/ontology/CheckOntology.java') }}

        - name: Install pinned ontology reasoner
          run: poetry run python scripts/ontology/check_ontology.py --install

        - name: Run tests
          env:
            PYTEST_DEBUG_TEMPROOT: ${{ github.workspace }}/artifacts
          run: poetry run pytest

        - name: Build package
          run: poetry build

        - name: Retain ontology diagnostics on failure
          if: failure()
          uses: actions/upload-artifact@v4
          with:
            name: ontology-${{ matrix.os }}-python-${{ matrix.python-version }}
            path: artifacts/ontology-consistency/ontology-*/
            if-no-files-found: ignore
            retention-days: 7
